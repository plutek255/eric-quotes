name: Update Quotes

on:
  push:
    paths:
      - "quotes.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate markdown + QOTD
        run: |
          python3 << 'EOF'
          import json, random, pathlib

          quotes_path = pathlib.Path("quotes.json")
          md_path = pathlib.Path("quotes_readable.md")
          qotd_path = pathlib.Path("qotd.txt")

          # Load quotes
          quotes = json.loads(quotes_path.read_text())

          # Generate markdown
          lines = ["# Eric Quotes\n"]
          for q in quotes:
            text = q.get("quote", "")
            ctx = q.get("context", "")
            date = q.get("date", "")
            lines.append(f"- **{text}**")
            if ctx or date:
              meta = []
              if ctx: meta.append(f"Context: {ctx}")
              if date: meta.append(f"Date: {date}")
              lines.append(f"  - _{' | '.join(meta)}_")
            lines.append("")

          md_path.write_text("\n".join(lines))

          # Generate QOTD
          random_quote = random.choice(quotes)
          qotd_path.write_text(random_quote.get("quote", "No quotes found."))
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add quotes_readable.md qotd.txt
          git commit -m "Auto-update quotes_readable.md and qotd.txt" || echo "No changes to commit"

      - name: Push changes
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'quotes_readable.md',
              message: 'Update quotes_readable.md',
              content: Buffer.from(require('fs').readFileSync('quotes_readable.md')).toString('base64'),
              sha: (await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'quotes_readable.md'
              }).catch(() => ({ data: { sha: null } }))).data.sha
            })

            github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'qotd.txt',
              message: 'Update qotd.txt',
              content: Buffer.from(require('fs').readFileSync('qotd.txt')).toString('base64'),
              sha: (await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'qotd.txt'
              }).catch(() => ({ data: { sha: null } }))).data.sha
            })
