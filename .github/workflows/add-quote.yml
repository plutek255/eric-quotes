      - name: Add quote
        shell: bash
        env:
          DATE_INPUT: ${{ inputs.quote_date }}
          QUOTE_AUTHOR: ${{ inputs.author }}
          QUOTE_NAME: ${{ inputs.name }}
          QUOTE_CONTEXT: ${{ inputs.context }}
          QUOTE_DESCRIPTION: ${{ inputs.description }}
        run: |
          set -euo pipefail

          QUOTES_FILE="json/quotes.json"
          TEMP_FILE="${QUOTES_FILE}.tmp"

          mkdir -p "$(dirname "$QUOTES_FILE")"

          if [ ! -f "$QUOTES_FILE" ]; then
            printf '%s\n' '{"quotes":{}}' > "$QUOTES_FILE"
          fi

          ISO_DATE=$(
            TZ=America/New_York date -d "$DATE_INPUT" '+%Y-%m-%dT%H:%M:%S%:z'
          )

          jq \
            --arg date "$ISO_DATE" \
            --arg author "$QUOTE_AUTHOR" \
            --arg name "$QUOTE_NAME" \
            --arg context "$QUOTE_CONTEXT" \
            --arg description "$QUOTE_DESCRIPTION" \
            '
            .quotes[$date] = {
              author: $author,
              name: $name,
              context: $context,
              description: $description
            }
            ' "$QUOTES_FILE" > "$TEMP_FILE"

          mv "$TEMP_FILE" "$QUOTES_FILE"
