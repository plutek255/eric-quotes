name: Quote Manager

on:
  push:
  workflow_dispatch:

jobs:
  update-quotes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate quote and archive files
        run: |
          python3 << 'EOF'
          import json
          import pathlib
          import random
          import re
          from datetime import datetime

          root = pathlib.Path(".")
          quotes_path = root / "json" / "quotes.json"
          readable_quotes_path = root / "quotes" / "quotes_readable.md"
          qotd_path = root / "quotes" / "qotd.txt"
          archive_dir = root / "archive"

          readable_quotes_path.parent.mkdir(parents=True, exist_ok=True)
          archive_dir.mkdir(parents=True, exist_ok=True)

          data = json.loads(quotes_path.read_text(encoding="utf-8"))
          quotes = data.get("quotes", {})
          archive = data.get("archive", {})

          def format_date(value):
              if not value or value in ("null", ""):
                  return None

              try:
                  parsed_date = datetime.fromisoformat(
                      str(value).replace("Z", "+00:00")
                  )
                  return parsed_date.strftime("%Y-%m-%d at %H:%M")
              except (TypeError, ValueError):
                  return None

          def safe_filename(value, fallback):
              value = str(value or fallback).strip().lower()
              value = re.sub(r"[^a-z0-9._-]+", "-", value)
              value = value.strip("-._")
              return value or fallback

          def normalize_entries(value):
              if isinstance(value, dict):
                  return list(value.items())

              if isinstance(value, list):
                  return [
                      (str(index), entry)
                      for index, entry in enumerate(value, start=1)
                  ]

              return []

          def format_quote(
              entry,
              footnotes,
              footnote_index,
              date_value=None,
          ):
              entry = entry or {}

              quote = entry.get("name", "Untitled quote")
              context = entry.get("context", "")
              description = entry.get("description", "")
              author = entry.get("author", "Unknown")
              formatted_date = format_date(date_value)

              lines = [f'## "{quote}"', ""]

              if formatted_date:
                  lines.append(f"**DATE:** {formatted_date}")
              else:
                  footnotes.append(
                      f"[^{footnote_index}]: This quote has no recorded date."
                  )
                  lines.append(
                      f"*Date unknown* [^{footnote_index}]"
                  )
                  footnote_index += 1

              if context:
                  footnotes.append(
                      f"[^{footnote_index}]: Context details: {context}"
                  )
                  lines.append(
                      f"**Context:** {context} [^{footnote_index}]"
                  )
                  footnote_index += 1

              lines.append("")

              if description:
                  footnotes.append(
                      f"[^{footnote_index}]: Description: {description}"
                  )
                  lines.append(
                      f"> {description} [^{footnote_index}]"
                  )
                  footnote_index += 1
                  lines.append("")

              lines.append("---")
              lines.append(f"<sub>Contributed by **{author}**</sub>")
              lines.append("")

              return lines, footnote_index

          # generate the combined readable quotes file
          quote_lines = ["# Eric Quotes", ""]
          quote_footnotes = []
          footnote_index = 1

          for quote_date, entry in normalize_entries(quotes):
              formatted_lines, footnote_index = format_quote(
                  entry,
                  quote_footnotes,
                  footnote_index,
                  date_value=(entry or {}).get("date") or quote_date,
              )
              quote_lines.extend(formatted_lines)

          if quote_footnotes:
              quote_lines.extend(["", "---", ""])
              quote_lines.extend(quote_footnotes)

          readable_quotes_path.write_text(
              "\n".join(quote_lines) + "\n",
              encoding="utf-8"
          )

          # generate a random quote of the day
          quote_entries = normalize_entries(quotes)

          if quote_entries:
              _, entry = random.choice(quote_entries)
              qotd_path.write_text(
                  (entry or {}).get("name", "No quote text"),
                  encoding="utf-8"
              )
          else:
              qotd_path.write_text(
                  "No quotes found.",
                  encoding="utf-8"
              )

          # remove previously generated archive markdown files
          for old_file in archive_dir.glob("*.md"):
              old_file.unlink()

          # generate archived quotes using the same formatting as regular quotes
          archive_entries = normalize_entries(archive)

          for index, (_, entry) in enumerate(archive_entries, start=1):
              archive_footnotes = []
              formatted_lines, _ = format_quote(
                  entry,
                  archive_footnotes,
                  1,
                  date_value=(entry or {}).get("date")
                  if isinstance(entry, dict)
                  else None,
              )

              archive_lines = formatted_lines

              if archive_footnotes:
                  archive_lines.extend(["", "---", ""])
                  archive_lines.extend(archive_footnotes)

              entry = entry or {}
              quote = entry.get("name", f"Archived Quote {index}")
              filename_base = safe_filename(
                  quote,
                  f"archive-{index}"
              )
              output_path = archive_dir / (
                  f"{index:04d}-{filename_base}.md"
              )

              output_path.write_text(
                  "\n".join(archive_lines) + "\n",
                  encoding="utf-8"
              )

          print(f"generated {len(quote_entries)} quotes")
          print(f"generated {len(archive_entries)} archived quotes")
          EOF

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add quotes/ archive/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update generated quote and archive files"
            git push
          fi
