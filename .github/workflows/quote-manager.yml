       name: Quote Manager
        run: |
          python3 << 'EOF'
          import json, random, pathlib
          from datetime import datetime

          quotes_path = pathlib.Path("quotes.json")
          md_path = pathlib.Path("quotes_readable.md")
          qotd_path = pathlib.Path("qotd.txt")

          data = json.loads(quotes_path.read_text())
          quotes = data.get("quotes", {})

          def format_date(d):
              if not d or d in ("null", ""):
                  return None
              try:
                  dt = datetime.fromisoformat(d.replace("Z", "+00:00"))
                  return dt.strftime("%Y-%m-%d at %H:%M")
              except Exception:
                  return None

          lines = ["# Eric Quotes\n"]
          footnotes = []
          footnote_index = 1

          def add_footnote(text):
              nonlocal footnote_index
              footnotes.append(f"[^{footnote_index}]: {text}")
              footnote_index += 1
              return footnote_index - 1

          for iso_date, entry in quotes.items():
              quote = entry.get("name", "")
              context = entry.get("context", "")
              desc = entry.get("description", "")
              author = entry.get("author", "Unknown")

              lines.append(f"## \"{quote}\"\n")

              # Date
              formatted = format_date(iso_date)
              if formatted:
                  lines.append(f"**DATE:** {formatted}")
              else:
                  fn = add_footnote("This quote has no recorded date.")
                  lines.append(f"*Date unknown* [^{fn}]")

              # Context
              if context:
                  fn = add_footnote(f"Context details: {context}")
                  lines.append(f"**Context:** {context} [^{fn}]")

              lines.append("")  # spacing

              # Description
              if desc:
                  fn = add_footnote(f"Description: {desc}")
                  lines.append(f"> {desc} [^{fn}]\n")

              # Contributor footer
              lines.append("---")
              lines.append(f"<sub>Contributed by **{author}**</sub>\n")

          # Append footnotes
          if footnotes:
              lines.append("\n---\n")
              lines.extend(footnotes)

          md_path.write_text("\n".join(lines))

          # Random quote selection
          if quotes:
              iso_date, entry = random.choice(list(quotes.items()))
              qotd_path.write_text(entry.get("name", "No quote text"))
          else:
              qotd_path.write_text("No quotes found.")
          EOF
